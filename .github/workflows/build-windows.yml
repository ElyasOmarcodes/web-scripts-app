name: Build Windows app

# Produces a single installer executable (WebScripts-Setup-<version>-x64.exe)
# and a portable build compressed with LZMA2 (.7z). Every run is published as
# a release that replaces the previous one.

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "0.1.0"
  PYTHON_VERSION: "3.12"
  FLUTTER_VERSION: "3.47.2"

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Run pytest
        working-directory: backend
        run: python -m pytest tests -q

  build:
    name: Build Windows executable
    needs: test-backend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------- backend
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Bundle backend into one exe
        run: pyinstaller packaging/webscripts-backend.spec --noconfirm --distpath dist/backend --workpath build/pyinstaller

      - name: Check the backend exe starts
        shell: pwsh
        run: |
          $exe = "dist/backend/webscripts-backend.exe"
          if (-not (Test-Path $exe)) { throw "backend exe was not produced" }
          $proc = Start-Process $exe -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-RestMethod http://127.0.0.1:8765/api/health -TimeoutSec 2
              if ($r.ok) { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "bundled backend did not answer /api/health" }
          Write-Host "backend exe answered /api/health"

      # ------------------------------------------------------------ frontend
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate the Windows runner
        working-directory: frontend
        shell: pwsh
        run: |
          if (-not (Test-Path windows)) {
            flutter create --platforms=windows --project-name web_scripts .
          }
          # `flutter create` writes a stub test referring to a MyApp that does
          # not exist here; drop it if it ever reappears.
          $stub = "test/widget_test.dart"
          if ((Test-Path $stub) -and (Select-String -Path $stub -Pattern "MyApp" -Quiet)) {
            Write-Host "removing the generated MyApp stub"
            Remove-Item $stub
          }

      - name: Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      # Flutter picks its CMake generator from the Visual Studio it detects;
      # when detection fails it falls back to "Visual Studio 16 2019" and the
      # build dies with "could not find any instance of Visual Studio".
      - name: Flutter doctor
        run: flutter doctor -v

      - name: Analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        working-directory: frontend
        run: flutter test

      # --no-tree-shake-icons: the shaker drops icons it cannot see used as a
      # constant, and several rendered as empty boxes in the built app. The
      # whole icon font costs about a megabyte and removes the class of bug.
      - name: Build Windows release
        working-directory: frontend
        run: flutter build windows --release --no-tree-shake-icons

      # ----------------------------------------------------------- packaging
      - name: Assemble the app folder
        shell: pwsh
        run: |
          $release = "frontend/build/windows/x64/runner/Release"
          if (-not (Test-Path $release)) { $release = "frontend/build/windows/runner/Release" }
          New-Item -ItemType Directory -Force -Path dist/app | Out-Null
          Copy-Item "$release/*" dist/app -Recurse -Force
          Copy-Item dist/backend/webscripts-backend.exe dist/app -Force
          Copy-Item README.md dist/app -Force
          Get-ChildItem dist/app | Select-Object Name, Length

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the single installer exe
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc packaging/installer.iss /DAppVersion=$env:APP_VERSION /DSourceDir=..\dist\app /DOutputDir=..\dist
          Get-ChildItem dist/*.exe

      # LZMA2 — the xz compressor — in a .7z container. xz alone only ever
      # compresses ONE file, which is why "tar.xz" exists; .7z packs the whole
      # folder with the same compressor, so there is no tar layer in the name
      # and the solid archive comes out smaller still.
      - name: Compress the portable build
        shell: pwsh
        run: |
          $name = "WebScripts-Portable-$env:APP_VERSION-x64"
          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = "7z" }
          & $sevenZip a -t7z -m0=LZMA2 -mx=9 -md=128m -mfb=273 -ms=on `
            "dist/$name.7z" "dist/app/*"
          if ($LASTEXITCODE -ne 0) { throw "compression failed" }
          Get-ChildItem dist/*.7z, dist/*.exe |
            Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}

      # Only the portable archive goes into the artifact: GitHub zips whatever
      # it is given, and adding the installer next to it would double the size.
      - name: Upload the portable archive
        uses: actions/upload-artifact@v4
        with:
          name: WebScripts-windows-x64
          path: dist/WebScripts-Portable-*.7z
          if-no-files-found: error

      # Every run is kept as one rolling release; the previous one (and its
      # tag) is removed first so the repository never collects old builds.
      - name: Replace the previous release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $keep = "build-${{ github.run_number }}"
          $old = gh release list --limit 50 --json tagName |
            ConvertFrom-Json |
            Where-Object { $_.tagName -like "build-*" -and $_.tagName -ne $keep }
          foreach ($release in $old) {
            Write-Host "deleting release $($release.tagName)"
            gh release delete $release.tagName --cleanup-tag --yes
          }

      - name: Publish this build
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: WebScripts ${{ env.APP_VERSION }} (build ${{ github.run_number }})
          body: |
            د `${{ github.sha }}` کامیټ اتوماتیک جوړ شوی نسخه.

            * `WebScripts-Setup-${{ env.APP_VERSION }}-x64.exe` — نصبوونکی (یو واحد فایل).
            * `WebScripts-Portable-${{ env.APP_VERSION }}-x64.7z` — پورټبل نسخه (LZMA2/xz فشرده).

            پورټبل نسخه د 7-Zip یا WinRAR سره پرانیستل کېږي.
          files: |
            dist/WebScripts-Setup-*.exe
            dist/WebScripts-Portable-*.7z
